# nginx site for the Langflow editor + MCP server (keep behind Cloudflare Access).
# Install:
#   sudo cp cekpkwt-langflow.conf /etc/nginx/sites-available/cekpkwt-langflow
#   sudo ln -s /etc/nginx/sites-available/cekpkwt-langflow /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Uniquely named so it can't clash with a map in another site file.
map $http_upgrade $cekpkwt_langflow_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cekpkwt-langflow.britod.my.id;

    # Room for uploading labor_corpus.csv in the ingest flow.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        # Cloudflare terminates TLS, so the visitor's connection is HTTPS.
        proxy_set_header X-Forwarded-Proto https;

        # WebSockets / streaming responses (editor, MCP Streamable HTTP)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cekpkwt_langflow_upgrade;
        proxy_buffering off;

        # LLM calls can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
