# nginx site for the CekPKWT FastAPI backend (public; the web app calls it).
# Install:
#   sudo cp cekpkwt-api.conf /etc/nginx/sites-available/cekpkwt-api
#   sudo ln -s /etc/nginx/sites-available/cekpkwt-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limit per visitor. Behind the Cloudflare Tunnel, $remote_addr is always the
# local cloudflared, so key on the visitor IP Cloudflare sends in CF-Connecting-IP.
# Each check costs OpenAI/Gemini tokens; 10 requests a minute is a demo-sized limit.
limit_req_zone $http_cf_connecting_ip zone=cekpkwt_api:10m rate=10r/m;

server {
    listen 80;
    server_name cekpkwt-api.britod.my.id;

    # The backend accepts contracts up to 60,000 characters.
    client_max_body_size 1m;

    location /api/ {
        limit_req zone=cekpkwt_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;

        # A contract check can take a while; backend's own limit is LANGFLOW_TIMEOUT.
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # Nothing else is served here.
    location / {
        return 404;
    }
}
