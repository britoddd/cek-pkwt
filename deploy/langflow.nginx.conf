# nginx site for Langflow behind your Cloudflare Tunnel (wildcard -> port 80).
# Install:
#   sudo cp langflow.nginx.conf /etc/nginx/sites-available/langflow
#   sudo ln -s /etc/nginx/sites-available/langflow /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Uniquely named so it can't clash with a map in another site file.
map $http_upgrade $langflow_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name langflow.yourdomain.com;

    # Room for uploaded contract PDFs.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS, so the visitor's connection is HTTPS.
        proxy_set_header X-Forwarded-Proto https;

        # WebSockets / streaming responses
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $langflow_connection_upgrade;
        proxy_buffering off;

        # LLM calls can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
